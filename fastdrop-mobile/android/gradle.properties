org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# NDK 30 is installed locally via Android Studio. Don't let AGP auto-download.
android.builder.sdkDownload=false
# Kotlin daemon has path-encoding issues with Chinese Windows username.
# Run Kotlin compiler in-process to bypass the daemon.
kotlin.compiler.execution.strategy=in-process
# Disable Gradle build cache to avoid stale/corrupt cache entries.
org.gradle.caching=false
