plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}

def releaseStoreFile = keystoreProperties.getProperty('storeFile') ?: System.getenv('FASTDROP_KEYSTORE_FILE')
def releaseStorePassword = keystoreProperties.getProperty('storePassword') ?: System.getenv('FASTDROP_KEYSTORE_PASSWORD')
def releaseKeyAlias = keystoreProperties.getProperty('keyAlias') ?: System.getenv('FASTDROP_KEY_ALIAS')
def releaseKeyPassword = keystoreProperties.getProperty('keyPassword') ?: System.getenv('FASTDROP_KEY_PASSWORD')
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
    .every { it != null && !it.toString().trim().isEmpty() }
def requireReleaseSigning = project.findProperty('fastdrop.requireReleaseSigning')?.toString()?.toBoolean() ?: false
if (requireReleaseSigning && !hasReleaseSigning) {
    throw new GradleException('FastDrop release signing is required but key.properties or FASTDROP_KEY_* is incomplete.')
}

android {
    namespace "com.fastdrop.fastdrop_mobile"
    compileSdk 36
    // Use the locally installed NDK (don't let AGP auto-download another).
    ndkVersion "30.0.15729638"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.fastdrop.fastdrop_mobile"
        minSdkVersion flutter.minSdkVersion
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                // Local acceptance builds remain installable. Production CI
                // must pass -Pfastdrop.requireReleaseSigning=true.
                signingConfig signingConfigs.debug
                logger.warn('FastDrop release APK is debug-signed; configure key.properties before distribution.')
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies {}
